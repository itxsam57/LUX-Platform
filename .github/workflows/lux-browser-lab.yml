name: LUX Browser Lab

on:
  push:
    branches:
      - infra/lux-browser-lab
    paths:
      - '.github/workflows/lux-browser-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lux-browser-lab-rdp
  cancel-in-progress: false

env:
  TARGET_SHA: 86746a9810dcc558eeace34ae29017d2f36b9e3f
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:30002
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.LUX_DEV_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LUX_DEV_SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_SERVICE_ROLE_KEY_FROM_GITHUB: ${{ secrets.LUX_DEV_SUPABASE_SERVICE_ROLE_KEY }}
  AGE_ASSURANCE_MODE: self_attestation
  IDENTITY_VERIFICATION_ENVIRONMENT: test
  IDENTITY_VERIFICATION_MODE: synthetic
  PAYMENT_ENVIRONMENT: test
  PAYMENT_MODE: sandbox

jobs:
  brave-acceptance:
    name: Exact-SHA Brave acceptance
    runs-on: [self-hosted, Linux, X64, lux-browser, brave, headless, rdp, ubuntu-24-04]
    timeout-minutes: 35

    steps:
      - name: Wait for Email Shield live work to be idle
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            if ! ps -eo args= | grep -F '/actions-runner-email-shield/bin/Runner.Worker' | grep -v grep >/dev/null; then
              echo 'Email Shield live runner is idle.'
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo 'Email Shield live browser work is active; waiting before using shared VM resources.'
            fi
            sleep 10
          done
          echo 'Timed out waiting for Email Shield live runner to become idle.' >&2
          exit 1

      - name: Verify Email Shield-style XFCE runner contract
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/lux-live/runtime.env"
          test "$RUNNER_NAME" = "lux-browser-rdp-01"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          [[ "$(node --version)" == v22.* ]]
          test -n "${DISPLAY:-}"
          test -n "${DBUS_SESSION_BUS_ADDRESS:-}"
          command -v secret-tool >/dev/null
          command -v xdpyinfo >/dev/null
          test -x "$LUX_TEST_BROWSER"
          xdpyinfo -display "$DISPLAY" >/dev/null
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          {
            echo "LUX_TEST_BROWSER=$LUX_TEST_BROWSER"
            echo "LUX_BROWSER_MODE=$LUX_BROWSER_MODE"
            echo "LUX_LIVE_PRODUCT_ROOT=$LUX_LIVE_PRODUCT_ROOT"
            echo "LUX_PROFILE_ROOT=$LUX_PROFILE_ROOT"
            echo "LUX_ARTIFACT_ROOT=$LUX_ARTIFACT_ROOT"
          } >> "$GITHUB_ENV"
          echo 'LUX_XFCE_RUNNER_READY=true'
          echo 'LUX_PUBLIC_DEV_DATABASE_READY=true'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare exact Slice 10 product SHA like Email Shield
        shell: bash
        run: |
          set -euo pipefail
          root="$LUX_LIVE_PRODUCT_ROOT"
          rm -rf "$root"
          mkdir -p "$root"
          cd "$root"
          git init -q
          git remote add origin https://github.com/itxsam57/LUX-Platform.git
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git checkout --detach -q FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "Expected candidate: $TARGET_SHA"
          echo "Actual checkout:    $actual"
          test "$actual" = "$TARGET_SHA"
          pnpm install --frozen-lockfile
          echo "LUX_EXACT_PRODUCT_PREP_PASS=$actual"

      - name: Generate disposable real-Brave Playwright config
        shell: bash
        run: |
          set -euo pipefail
          cd "$LUX_LIVE_PRODUCT_ROOT"
          cat > apps/web/playwright.browser-lab.config.ts <<'EOF'
          import { defineConfig, devices } from "@playwright/test";
          const localBaseUrl = "http://127.0.0.1:30002";
          const braveExecutable = process.env.LUX_TEST_BROWSER;
          const visible = process.env.LUX_BROWSER_MODE === "visible";
          if (!braveExecutable) throw new Error("LUX_TEST_BROWSER is required");
          export default defineConfig({
            testDir: "./tests/e2e",
            fullyParallel: false,
            workers: 1,
            forbidOnly: true,
            retries: 0,
            reporter: [["line"], ["html", { open: "never" }]],
            use: {
              baseURL: localBaseUrl,
              headless: !visible,
              trace: "retain-on-failure",
              screenshot: "only-on-failure",
              video: "off",
              launchOptions: {
                executablePath: braveExecutable,
                args: visible
                  ? ["--ozone-platform=x11", "--disable-gpu", "--disable-dev-shm-usage"]
                  : ["--disable-gpu", "--disable-dev-shm-usage"],
              },
            },
            projects: [
              { name: "brave-desktop", use: { ...devices["Desktop Chrome"] } },
              { name: "brave-mobile", use: { ...devices["Pixel 7"] } },
            ],
            webServer: {
              command: "pnpm build && pnpm start",
              url: `${localBaseUrl}/health`,
              reuseExistingServer: false,
              timeout: 180_000,
            },
          });
          EOF

      - name: Run public Slice 10 foundation in real Brave
        shell: bash
        run: |
          set -euo pipefail
          cd "$LUX_LIVE_PRODUCT_ROOT"
          pnpm --filter @lux/web exec playwright test \
            tests/e2e/foundation.spec.ts \
            --config=playwright.browser-lab.config.ts
          echo 'LUX_REAL_BRAVE_PUBLIC_SMOKE_PASS=true'

      - name: Resolve protected service-role credential for privileged owner suite
        id: privileged
        shell: bash
        run: |
          set -euo pipefail
          service_role="${SUPABASE_SERVICE_ROLE_KEY_FROM_GITHUB:-}"
          if [ -z "$service_role" ]; then
            service_role="$(secret-tool lookup application lux-browser-lab credential supabase-service-role 2>/dev/null || true)"
          fi
          if [ -z "$service_role" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'LUX_PRIVILEGED_OWNER_SUITE_BLOCKED=missing-service-role'
            exit 0
          fi
          echo "::add-mask::$service_role"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_role" >> "$GITHUB_ENV"
          echo 'available=true' >> "$GITHUB_OUTPUT"
          unset service_role
          echo 'LUX_PRIVILEGED_CREDENTIAL_READY=true'

      - name: Run cumulative Slices 4-10 journey in real Brave
        if: steps.privileged.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$LUX_LIVE_PRODUCT_ROOT"
          pnpm --filter @lux/web exec playwright test \
            tests/e2e/marketplace-4-10-journey.spec.ts \
            --config=playwright.browser-lab.config.ts
          echo 'LUX_REAL_BRAVE_MARKETPLACE_4_10_PASS=true'

      - name: Copy bounded failure evidence to LUX artifact root
        if: failure()
        shell: bash
        run: |
          set -u
          source "$HOME/lux-live/runtime.env"
          mkdir -p "$LUX_ARTIFACT_ROOT"
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          dest="$LUX_ARTIFACT_ROOT/$stamp"
          mkdir -p "$dest"
          cp -a "$LUX_LIVE_PRODUCT_ROOT/apps/web/playwright-report" "$dest/" 2>/dev/null || true
          cp -a "$LUX_LIVE_PRODUCT_ROOT/apps/web/test-results" "$dest/" 2>/dev/null || true
          echo "LUX_FAILURE_EVIDENCE_LOCAL=$dest"

      - name: Publish acceptance summary
        if: always()
        shell: bash
        run: |
          {
            echo '## LUX Browser Lab'
            echo ''
            echo "- target product SHA: \`$TARGET_SHA\`"
            echo "- runner: \`$RUNNER_NAME\`"
            echo '- architecture: persistent XFCE/VNC + installed Brave, matching Email Shield'
            echo '- database: hosted LUX development Supabase; no Docker/local Supabase'
            echo '- public foundation: real Brave desktop + Pixel 7 mobile'
            if [ "${{ steps.privileged.outputs.available }}" = "true" ]; then
              echo '- privileged Slice 4-10 journey: executed'
            else
              echo '- privileged Slice 4-10 journey: waiting only for protected service-role credential'
            fi
            echo '- product feature branch/PR were not modified by this workflow'
          } >> "$GITHUB_STEP_SUMMARY"
