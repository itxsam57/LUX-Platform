name: Slice 3 Lockfile Refresh

on:
  push:
    branches:
      - feature/slice-3-profiles-privacy
    paths:
      - package.json
      - .github/workflows/refresh-lockfile-slice3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/slice-3-profiles-privacy

      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerate exact pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit generated lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already stable."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate lockfile for patched nanoid"
          git push origin HEAD:feature/slice-3-profiles-privacy
