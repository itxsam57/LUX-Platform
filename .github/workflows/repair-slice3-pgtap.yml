name: Repair Slice 3 pgTAP fixtures

on:
  push:
    branches:
      - feature/slice-3-profiles-privacy
    paths:
      - .github/workflows/repair-slice3-pgtap.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/slice-3-profiles-privacy
      - name: Repair stale media and anonymous fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          anon = "set local role anon;\nselect set_config('request.jwt.claims', jsonb_build_object('role', 'anon')::text, true);\n"
          for filename in [
              'supabase/tests/0003_profiles_privacy_rls.test.sql',
              'supabase/tests/0004_profile_media_boundary.test.sql',
          ]:
              path = Path(filename)
              text = path.read_text()
              text = text.replace('set local role anon;\n', anon)
              path.write_text(text)

          path = Path('supabase/tests/0003_profiles_privacy_rls.test.sql')
          text = path.read_text()
          text = text.replace(
              '10000000-0000-0000-0000-000000000031/avatar.webp',
              'fb63da1655d5d3a13ac0ed84a153413814517c0338f0f456d52a12d8911cdbaf/avatar.webp',
          )
          text = text.replace(
              '10000000-0000-0000-0000-000000000031/banner.webp',
              'fb63da1655d5d3a13ac0ed84a153413814517c0338f0f456d52a12d8911cdbaf/banner.webp',
          )
          text = text.replace(
              '10000000-0000-0000-0000-000000000033/avatar.webp',
              'b72473d496e2d12cd918895055233f4e6edb3c7d9e0f3c2f40baea88ee6ff05e/avatar.webp',
          )
          path.write_text(text)

          Path('.github/workflows/repair-slice3-pgtap.yml').unlink()
          PY
      - name: Commit repaired fixtures and retire helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/tests/0003_profiles_privacy_rls.test.sql supabase/tests/0004_profile_media_boundary.test.sql .github/workflows/repair-slice3-pgtap.yml
          git commit -m "test(db): align Slice 3 media fixtures with opaque boundary"
          git push origin HEAD:feature/slice-3-profiles-privacy
