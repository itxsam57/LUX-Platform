name: Lockfile Refresh

on:
  push:
    branches:
      - feature/slice-2-auth-isolation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/slice-2-auth-isolation

      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify lockfile uses patched PostCSS
        shell: bash
        run: |
          grep -q "postcss: 8.5.23" pnpm-lock.yaml
          if grep -q "postcss: 8.5.18" pnpm-lock.yaml; then
            echo "Stale vulnerable PostCSS override remains in lockfile."
            exit 1
          fi

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(deps): refresh lockfile for patched PostCSS"
          git push origin HEAD:feature/slice-2-auth-isolation

      - uses: actions/upload-artifact@v7
        with:
          name: refreshed-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
