name: Lockfile Refresh

on:
  push:
    branches:
      - feature/slice-2-auth-isolation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockfile-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify lockfile uses patched PostCSS
        shell: bash
        run: |
          grep -q "postcss: 8.5.23" pnpm-lock.yaml
          if grep -q "postcss: 8.5.18" pnpm-lock.yaml; then
            echo "Stale vulnerable PostCSS override remains in lockfile."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: refreshed-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
