name: Regenerate Slice 3 lockfile

on:
  push:
    branches:
      - feature/slice-3-profiles-privacy
    paths:
      - apps/web/package.json
      - package.json
      - .github/workflows/regenerate-slice3-lock.yml

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/slice-3-profiles-privacy
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --lockfile-only
      - name: Commit exact generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build(profile): regenerate lockfile for Sharp 0.35.3"
          git push origin HEAD:feature/slice-3-profiles-privacy
